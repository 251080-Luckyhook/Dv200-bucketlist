<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stamp a New Memory — Bucket List Memories</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="css/style.css" rel="stylesheet" />
</head>
<body>

  <!-- Navbar -->
  <nav class="site-navbar d-flex align-items-center justify-content-between">
    <a class="brand" href="index.html">
      <span class="star">&#9733;</span>
      Bucket List Memories
    </a>
    <div class="d-none d-md-flex">
      <a class="nav-link" href="index.html">Feed</a>
      <a class="nav-link active" href="add-memory.html">Add memory</a>
      <a class="nav-link" href="votes.html">vote's</a>
      <a class="nav-link" href="passport.html">My passport</a>
    </div>
    <a href="login.html" class="avatar-circle text-decoration-none">ML</a>
  </nav>

  <div class="container py-5">
    <h1 class="fw-bold">Stamp a new memory</h1>
    <p class="text-muted mb-4">
      This is something you've already done — not something you're planning.
      Tell us where, when, and what happened.
    </p>

    <form>
      <div class="row mb-4">
        <div class="col-md-6 mb-3">
          <label class="form-label-strong">Title</label>
          <input type="text" class="form-control form-pill-input" placeholder="Mount Fuji climb" />
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label-strong">Country</label>
          <select class="form-select form-pill-input">
            <option>Japan</option>
            <option>Peru</option>
            <option>Indonesia</option>
            <option>Portugal</option>
            <option>South Africa</option>
          </select>
        </div>
      </div>

      <div class="row mb-4">
        <div class="col-md-6 mb-3">
          <label class="form-label-strong">Year completed</label>
          <select class="form-select form-pill-input">
            <option>2024</option>
            <option>2025</option>
            <option>2026</option>
          </select>
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label-strong">Category</label>
          <select class="form-select form-pill-input">
            <option>Adventure</option>
            <option>Food</option>
            <option>Culture</option>
            <option>Nature</option>
            <option>Nightlife</option>
            <option>Solo</option>
          </select>
        </div>
      </div>

      <div class="mb-4">
        <label class="form-label-strong">Tags</label>
        <div>
          <span class="tag-pill">Adventure</span>
          <span class="tag-pill">Food</span>
          <span class="tag-pill">Culture</span>
          <span class="tag-pill">Add tag +</span>
        </div>
      </div>

      <div class="mb-4">
        <label class="form-label-strong">Photo and video</label>
        <div class="row">
          <div class="col-md-8 mb-2">
            <div class="dropzone">drag and drop fotos and videos</div>
          </div>
          <div class="col-md-4 mb-2">
            <div class="dropzone" style="min-height:120px;"></div>
          </div>
        </div>
      </div>

      <div class="mb-4">
        <label class="form-label-strong">Your story</label>
        <textarea class="form-control form-pill-input" rows="3" placeholder="Add your story"></textarea>
      </div>

      <div class="mb-4">
        <label class="form-label-strong">Your next adventure</label>
        <input type="text" class="form-control form-pill-input mb-3" placeholder="Add adventure" />
        <input type="text" class="form-control form-pill-input mb-3" placeholder="Add adventure" />
        <input type="text" class="form-control form-pill-input" placeholder="Add adventure" />
      </div>

      <div class="form-check form-switch mb-4">
        <input class="form-check-input" type="checkbox" id="visibleSwitch" checked />
        <label class="form-check-label" for="visibleSwitch">
          Visible to the community (uncheck to keep this memory private)
        </label>
      </div>

      <a href="index.html" class="btn btn-pill-gold">Stamp this memory &#10022;</a>
    </form>
  </div>

</body>
</html>
